<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Target Calculator</title>

    <link
        rel="stylesheet"
        href="stle.css"
    >

</head>


<body>

    <header class="page-header"></header>

    <h1>Investment Target Calculator</h1>

    <p>
        Find out how much you need to invest
        every month to reach your target.
    </p>

     </header>


    <!-- =====================================
         TARGET AMOUNT
         ===================================== -->

         <main class="target-main">

        <div class="calculator-card">

            <div class="input-group">


    <label for="targetAmount">

        Target Amount (RM)

    </label>

    <input
        type="number"
        id="targetAmount"
        min="0"
    >


    </div>


            <div class="input-group">


    <!-- =====================================
         INITIAL INVESTMENT
         ===================================== -->

    <label for="targetInitialInvestment">

        Initial Investment (RM)

    </label>

    <input
        type="number"
        id="targetInitialInvestment"
        min="0"
    >


     </div>


            <div class="input-group">


    <!-- =====================================
         MONTHLY INVESTMENT
         ===================================== -->

    <label for="currentMonthlyInvestment">

        Current Monthly Investment (RM)

    </label>

    <input
        type="number"
        id="currentMonthlyInvestment"
        min="0"
    >


     </div>


            <div class="input-group">


    <!-- =====================================
         INVESTMENT PERIOD
         ===================================== -->

    <label for="targetInvestmentPeriod">

    Investment Period

</label>

<input
    type="number"
    id="targetInvestmentPeriod"
    min="1"
>

<select id="targetInvestmentPeriodUnit">

    <option value="years">Years</option>

    <option value="months">Months</option>

</select>

   </div>


            <div class="input-group">


    <!-- =====================================
         EXPECTED RETURN
         ===================================== -->

    <label for="targetReturn">

        Expected Annual Return (%)

    </label>

    <input
        type="number"
        id="targetReturn"
        min="0"
        step="0.01"
    >


     </div>


            <div class="calculate-area">


    <!-- =====================================
         CALCULATE BUTTON
         ===================================== -->

    <button id="targetCalculateButton">

        Calculate Target

    </button>


     </div>

        </div>



    <!-- =====================================
         RESULT
         ===================================== -->

    <section class="target-results">

            <h2>Target Result</h2>

            <div id="targetResult"></div>

        </section>

    </main>



    <!-- =====================================
         NAVIGATION
         ===================================== -->

    <!-- <button id="backButton">

        ← Calculator

    </button> -->

    <button id="backButton">
        ← Home
    </button>


    <script src="target.js"></script>

</body>

</html>
